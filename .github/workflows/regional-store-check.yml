name: Verify regional Shopify store registry
on:
  pull_request:
    paths:
      - "registry/regional-stores.json"
      - "scripts/check-regional-stores.mjs"
      - "scripts/check-regional-stores.test.mjs"
      - ".github/workflows/regional-store-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate regional store registry
        run: |
          node scripts/check-regional-stores.mjs
          node --test scripts/check-regional-stores.test.mjs
