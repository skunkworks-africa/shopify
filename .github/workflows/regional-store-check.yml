name: Verify regional Shopify store registry
on:
  pull_request:
    paths:
      - "config/regional-stores.json"
      - "scripts/check-regional-stores.mjs"
      - ".github/workflows/regional-store-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate regional store registry
        run: node scripts/check-regional-stores.mjs
