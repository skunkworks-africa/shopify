name: Validate adaptive monochrome demo

on:
  pull_request:
    paths:
      - 'index.html'
      - 'demo.css'
      - 'demo.js'
      - 'scripts/validate-demo.mjs'
      - '.github/workflows/demo-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'demo.css'
      - 'demo.js'
      - 'scripts/validate-demo.mjs'
      - '.github/workflows/demo-quality.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: node --check demo.js

      - name: Validate monochrome design contract
        run: node scripts/validate-demo.mjs
